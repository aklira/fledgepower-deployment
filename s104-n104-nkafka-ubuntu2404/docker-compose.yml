version: "3.1"

services:

  fledge-power:
    container_name: fledge
    image: ghcr.io/aklira/fledgepower/fledge:latest
    build:
      context: fledge/
      dockerfile: fledge.dockerfile
    ports:
      - "8081:8081"
      - "8080:8080"
      - "8090:8090"
      - "2404:2404"

    networks:
      - fledge-power

networks:
  fledge-power:
    driver: bridge